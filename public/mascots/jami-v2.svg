<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="core" x1="165" y1="135" x2="475" y2="525" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset=".38" stop-color="#DCE4EE"/>
      <stop offset=".78" stop-color="#AAB7C7"/>
      <stop offset="1" stop-color="#7F8EA0"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="220" x2="470" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69E0FF"/>
      <stop offset=".48" stop-color="#5F8CFF"/>
      <stop offset="1" stop-color="#9A72FF"/>
    </linearGradient>
    <linearGradient id="void" x1="230" y1="180" x2="390" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141B27"/>
      <stop offset="1" stop-color="#0A0F18"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".22"/>
    </filter>
    <filter id="softGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- detached fragment: Jami's signature -->
  <g transform="translate(475 155) rotate(17)">
    <path d="M0 24C-17 4-16-22 2-39C20-55 45-49 58-30C70-12 61 10 43 22C27 32 11 34 0 24Z"
          fill="url(#accent)" opacity=".14" filter="url(#softGlow)"/>
    <path d="M0 22C-15 3-14-20 3-36C20-51 43-46 55-28C66-11 58 8 41 19C25 29 10 31 0 22Z"
          fill="#1B2533" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="29" cy="-9" r="7" fill="#EAFBFF"/>
    <circle cx="31" cy="-11" r="3" fill="#6FE2FF"/>
  </g>

  <!-- faint connection traces -->
  <path d="M431 181C475 202 489 245 475 286" fill="none" stroke="#6D82FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 13" opacity=".55"/>
  <circle cx="430" cy="181" r="4" fill="#70E1FF"/>
  <circle cx="476" cy="286" r="4" fill="#9D78FF"/>

  <!-- body -->
  <g filter="url(#shadow)">
    <!-- rear fin/ear -->
    <path d="M183 239C147 219 135 178 154 151C171 126 204 129 221 151C233 166 233 190 223 211L210 243Z"
          fill="#A8B5C5" stroke="#7D8B9C" stroke-width="6"/>

    <!-- main silhouette, subtly J-like -->
    <path d="M228 135
             C311 105 409 128 455 193
             C494 249 484 337 450 410
             C425 462 380 492 322 492
             L263 492
             C217 492 182 470 168 435
             C154 401 167 372 190 354
             C211 338 222 319 217 292
             C207 238 193 168 228 135Z"
          fill="url(#core)" stroke="#78879A" stroke-width="7"/>

    <!-- lower hook = hidden J -->
    <path d="M211 315
             C198 355 201 392 228 417
             C251 439 287 445 326 437
             C360 430 385 413 399 389"
          fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" opacity=".9"/>
    <path d="M211 315
             C198 355 201 392 228 417
             C251 439 287 445 326 437"
          fill="none" stroke="#F2F7FD" stroke-width="5" stroke-linecap="round" opacity=".75"/>

    <!-- face void -->
    <path d="M217 191
             C237 158 288 147 332 160
             C372 172 394 207 390 244
             C386 278 358 302 320 309
             C281 316 239 302 220 274
             C204 251 204 216 217 191Z"
          fill="url(#void)" stroke="#2E3A4B" stroke-width="6"/>

    <!-- single eye -->
    <ellipse cx="305" cy="232" rx="42" ry="31" fill="#101723"/>
    <circle cx="305" cy="232" r="18" fill="#EBFDFF"/>
    <circle cx="305" cy="232" r="9" fill="#6DDAFF"/>
    <circle cx="300" cy="226" r="3.5" fill="#FFFFFF"/>

    <!-- small face mark -->
    <path d="M244 259C256 269 269 273 281 270" fill="none" stroke="#738297" stroke-width="4" stroke-linecap="round"/>

    <!-- soft chest core -->
    <ellipse cx="300" cy="366" rx="46" ry="58" fill="#1B2532" opacity=".92"/>
    <ellipse cx="300" cy="366" rx="29" ry="37" fill="url(#accent)" opacity=".17"/>
    <path d="M290 337
             C284 355 285 374 296 386
             C307 398 324 394 331 381"
          fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="330" cy="376" r="5" fill="#A97CFF"/>

    <!-- tiny floating hand -->
    <path d="M428 331C454 336 470 351 470 372C470 390 458 402 444 399"
          fill="none" stroke="#99A7B8" stroke-width="20" stroke-linecap="round"/>
    <circle cx="443" cy="398" r="10" fill="#DDE5EF"/>

    <!-- foot -->
    <path d="M236 486C225 507 230 529 250 536C271 543 292 531 298 509"
          fill="#9AA8B9" stroke="#778699" stroke-width="6"/>
    <path d="M334 486C331 510 344 527 365 527C386 527 398 512 390 489"
          fill="#8B99AB" stroke="#778699" stroke-width="6"/>
  </g>

  <!-- small motion dot -->
  <circle cx="151" cy="301" r="5" fill="#68DBFF" opacity=".9"/>
  <circle cx="469" cy="118" r="4" fill="#A77BFF" opacity=".9"/>
</svg>